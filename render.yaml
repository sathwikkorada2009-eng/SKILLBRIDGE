services:
  - type: web
    name: skillbridge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SKILLBRIDGE_DATA_FILE
        value: /tmp/skillbridge_data.json
